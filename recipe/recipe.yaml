schema_version: 1

context:
  name: flask-paginate
  version: "2024.4.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/lixxu/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: 6c9cbc7e8f054f7abeb6fe70c2ff8f02663833fee796c6b6a50d9e9d79dcd679

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask <3

tests:
  - python:
      imports:
        - flask_paginate
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Pagination support for flask
  description: |
    Paginate support for flask framework (study from will_paginate).
    Use bootstrap for css framework It requires Python2.6+ as string.
    format syntax.
  homepage: https://github.com/lixxu/flask-paginate
  repository: https://github.com/lixxu/flask-paginate
  documentation: http://flask-paginate.readthedocs.io/

extra:
  recipe-maintainers:
    - jan-janssen
